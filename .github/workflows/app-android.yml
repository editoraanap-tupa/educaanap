# Gera o app Android do Alfabetizando (APK de teste) a cada mudança na pasta do app.
name: App Android (APK de teste)

on:
  push:
    paths:
      - 'app-alfabetizando/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-alfabetizando
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: app-alfabetizando/android
      - uses: actions/upload-artifact@v4
        with:
          name: alfabetizando-teste-apk
          path: app-alfabetizando/android/app/build/outputs/apk/debug/app-debug.apk
